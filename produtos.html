<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global-style.css">
    <link rel="stylesheet" href="css/produtos.css">
    <title>Projeto Gestão de Estoque - Produtos</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>Controle de Estoque</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="produtos.html" class="ativo">Produtos</a></li>
                    <li><a href="">Estoque</a></li>
                    <li><a href="">Venda</a></li>
                    <li><a href="">Relatório</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="pagina-produtos">
           <div class="produtos-topo">
            <h2>Produtos</h2>
            <button class="btn-primario" type="button">+ Novo Produto</button>
           </div>

           <div class="barra-pesquisa">
            <input type="text" id="busca" placeholder="Buscar produto por nome ou código">
            <button class="btn-secundario" type="button" onclick="limparTudo()">Limpar Tudo</button>
           </div>

           <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Código</th>
                        <th>Preço</th>
                        <th>Qtd</th>
                        <th>Unidade</th>
                        <th>Mínimo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody class="grade-produtos">
                    <!-- JS vai preencher aqui -->
                </tbody>
            </table>
           </div>
        </section>
    </main>

    <div class="modal-fundo">
        <div class="modal">
            <div class="modal-topo">
                <h3 id="modal-titulo">Novo Produto</h3>
                <button type="button" class="btn-fechar">X</button>
            </div>
            <form>
                <label>Nome do Produto</label>
                <input id="nome" type="text" placeholder="Ex: Coca-Cola 2L" required>
                <label>Código</label>
                <input id="codigo" type="text" placeholder="Ex: 001" required>
                <label>Preço de Venda</label>
                <input id="preco" type="number" step="0.01" placeholder="Ex: 7.50" required>
                <label>Quantidade Inicial</label>
                <input id="qtd" type="number" placeholder="0" required>
                <label>Unidade de Medida</label>
                <select id="unidade" required>
                    <option value="UN">UN - Unidade</option>
                    <option value="CX">CX - Caixa</option>
                    <option value="KG">KG - Quilo</option>
                    <option value="L">L - Litro</option>
                    <option value="PCT">PCT - Pacote</option>
                </select>
                <label>Estoque Mínimo</label>
                <input id="minimo" type="number" placeholder="Ex: 5" required>
                <input type="hidden" id="edit-id">
                <div class="modal-botoes">
                    <button type="button" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/produtos.js"></script>
</body>
</html>

<!--
================ LEGENDA DIDÁTICA - produtos.html ================

AÇÃO 1 - CABEÇALHO E IMPORTAÇÃO DUPLO CSS:
- Aqui importa global-style.css (header, botões, reset) + produtos.css (só da página de produtos)
- Uma boa prática: CSS global + CSS específico da página
- class="ativo" no link Produtos: o CSS pinta o menu atual de azul, feedback pro usuário
- <h1>Controle de Estoque: Mesmo header do index.html, consistência

AÇÃO 2 - TOPO DA PÁGINA (TÍTULO + BOTÃO):
- section pagina-produtos: Container principal da página
- div produtos-topo: eu separou em flex: título na esquerda, botão na direita (padrão de sistema)
- button btn-primario + Novo Produto: Gatilho que o JS usa pra abrir o modal
- type="button": Importante! Sem isso, botão dentro de form tenta enviar form

AÇÃO 3 - BARRA DE PESQUISA (O QUE COLOQUEI PRA FUNCIONAR):
- div barra-pesquisa: Container da busca
- input id="busca": É AQUI que o JS pega com getElementById('busca'). Placeholder explica pro usuário
- placeholder "Buscar por nome ou código": UX, já diz que busca nos dois campos
- button onclick="limparTudo()": Botão que chama função global do JS, apaga tudo do localStorage

AÇÃO 4 - TABELA ESTILO EXCEL (ESTRUTURA QUE O JS PREENCHE):
- div tabela-container: Dá overflow, borda arredondada, sombra. Estilo Excel vem dele
- thead > tr > th: Cabeçalho fixo: Nome, Código, Preço, Qtd, Unidade, Mínimo, Ações
- tbody class="grade-produtos": VAZIO de propósito! É o alvo do JS. querySelector('.grade-produtos') vai jogar os <tr> aqui
- Comentário "
- JS vai preencher aqui ": Marca que o conteúdo é dinâmico

AÇÃO 5 - MODAL (JANELA FLUTUANTE ESCONDIDA):
- div modal-fundo: Fundo escuro com display:none no CSS, cobre a tela toda quando abre
- div modal: Caixa branca centralizada
- modal-topo: h3 titulo + botão X de fechar (btn-fechar)
- form: Formulário de cadastro. Cada input tem id que o JS usa:
    - id="nome", codigo, preco, qtd, unidade, minimo: São os dados do produto
    - type="number" step="0.01": Permite decimal no preço
    - required: Validação HTML5, não deixa salvar vazio
    - select id="unidade": Lista de unidades, melhor que digitar
    - input type="hidden" id="edit-id": TRUQUE DE PLENO! Guarda o ID quando está editando, se vazio é cadastro novo
- modal-botoes: Cancelar (fecha modal) e Salvar (type=submit, dispara salvarProduto)

AÇÃO 6 - LIGAÇÃO COM JS:
- script src="js/produtos.js": Última linha do body pra garantir que o HTML já carregou antes do JS rodar

FLUXO QUE FOI CRIADO: Usuário clica + Novo Produto -> JS abre modal-fundo -> preenche form -> submit -> JS salva no localStorage -> renderiza na grade-produtos -> barra de busca filtra
