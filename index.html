<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/global-style.css" />
    <title>Projeto Gestão de Estoque</title>
  </head>

  <body>
    <header>
      <div class="container">
        <h1>Controle de Estoque</h1>
        <nav>
          <ul>
            <li><a href="" class="dashboard">Dashboard</a></li>
            <li><a href="produtos.html" class="produtos">Produtos</a></li>
            <li><a href="" class="estoque">Estoque</a></li>
            <li><a href="" class="venda">Venda</a></li>
            <li><a href="" class="relatorio">Relatório</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="cards">
        <h2 class="tituloescondido">Resumo do estoque</h2>
        <div class="total">
          <p>Total de Estoque</p>
          <h2>150</h2>
          <p>Produtos Cadastrados</p>
        </div>
        <div class="estoquebaixo">
          <p>Estoque Baixo</p>
          <h2>8</h2>
          <p>Atenção repor estoque</p>
        </div>
        <div class="zerados">
          <p>Zerados</p>
          <h2>2</h2>
          <p>Sem estoque</p>
        </div>
      </section>

        
        
        
    </main>
  </body>
</html>

<!--
================ LEGENDA DIDÁTICA - index.html =================

AÇÃO 1 - CABEÇALHO (HEADER) - NAVEGAÇÃO GLOBAL:
- <header>: Semântica, é o topo do sistema
- div class="container": Truque que você usou pra centralizar e limitar largura, igual em todas as páginas
- h1 Controle de Estoque: Título do sistema
- nav > ul > li > a: Menu de navegação. Você usou classes (dashboard, produtos, etc) pra estilizar cada um
    - href="produtos.html": Link que leva pra página de produtos que fizemos

AÇÃO 2 - CARDS DE RESUMO (DASHBOARD):
- <main>: Conteúdo principal, semântica correta
- section class="cards": Agrupa os 3 cards, seu CSS deixa eles em flex/grid
- h2 class="tituloescondido":  H2 pra semântica mas escondido no CSS, porque leitor de tela precisa
- div total / estoquebaixo / zerados: São os 3 indicadores. Estrutura p > h2 > p = rótulo > número grande > descrição


O QUE EU APRENDE AQUI: Separar estrutura semântica (header, main, section) do visual (que está todo no global-style.css)
-->
